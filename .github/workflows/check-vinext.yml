name: Investigate vinext compatibility (no deploy)
on:
  push:
    branches:
      - experiment/uptimeflare-vinext
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install existing UptimeFlare dependencies
        run: npm ci --no-audit --no-fund
      - name: Check compatibility with Cloudflare vinext (diagnostic only)
        run: npx --yes vinext@latest check

      - name: Inspect non-interactive migration options (no changes)
        run: npx --yes vinext@latest init --help

      - name: Upgrade legacy framework dependencies in temporary runner
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          p.dependencies.next = '^16.4.5'
          p.dependencies.react = '^19.3.1'
          p.dependencies['react-dom'] = '^19.3.1'
          p.devDependencies['@types/react'] = '^19'
          p.devDependencies['@types/react-dom'] = '^19'
          delete p.devDependencies['@cloudflare/next-on-pages']
          delete p.devDependencies['eslint-config-next']
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')
          NODE
          npm install --no-audit --no-fund
      - name: Initialize vinext on temporary runner (not committed)
        env:
          CI: 'true'
        run: |
          mv wrangler.toml /tmp/uptimeflare-old-pages-wrangler.toml
          npx --yes vinext@latest init --platform=cloudflare --legacy-wrangler-cloudflare-init --name=uptimeflare-vinext-preview --cdn-cache=none
      - name: Build vinext Workers output (no deploy)
        run: npm run build:vinext
      - name: Report files changed by init
        if: always()
        run: git status --short
